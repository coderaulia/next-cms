<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_brand.css">
<style>

.label b{display:block;font-size:30px;letter-spacing:-.02em}

.stats{margin-top:28px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.stat b{font-size:48px;letter-spacing:-.03em;font-weight:600}.stat p{font-size:19px;color:#9fb0cf;margin-top:4px}
