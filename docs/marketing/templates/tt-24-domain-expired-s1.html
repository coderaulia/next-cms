<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="size" content="1080x1920"><link rel="stylesheet" href="_brand.css"><style>
html,body{width:1080px;height:1920px}
.post{width:1080px;height:1920px;padding:170px 150px 440px 72px}
.blue{background:linear-gradient(165deg,#2f6dff 0%,#1a47c4 55%,#14306f 100%);color:#fff}
.blue .muted{color:#dbe5ff}
.blue .brand .lw{background-image:url(../assets/brand/wordmark-white.png)}
.dark .brand .lm,.blue .brand .lm{box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.count{font-family:'JetBrains Mono',monospace;font-size:20px;letter-spacing:.08em}
.body{flex:1;display:flex;flex-direction:column;justify-content:center}
.k{font-family:'JetBrains Mono',monospace;font-size:24px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.dark .k{color:var(--accent-soft)}.blue .k{color:#dbe5ff}
.t{font-size:104px;line-height:1;letter-spacing:-.035em;font-weight:700;margin-top:22px}
.t i{font-family:'Instrument Serif',Georgia,serif;font-weight:400;letter-spacing:-.01em;color:var(--accent)}
.dark .t i{color:var(--accent-soft)}.blue .t i{color:#fff;opacity:.85}
.s{font-size:38px;line-height:1.35;margin-top:34px;color:var(--muted)}
.dark .s{color:#b8c6e0}.blue .s{color:#dbe5ff}
.num{font-size:150px;line-height:1;font-weight:700;color:var(--accent);letter-spacing:-.04em}
.dark .num{color:var(--accent-soft)}.blue .num{color:#fff}
.pt{font-size:80px;line-height:1.02;letter-spacing:-.03em;font-weight:700;margin-top:24px}
.pb{font-size:38px;line-height:1.4;margin-top:30px;color:var(--muted)}
.dark .pb{color:#b8c6e0}.blue .pb{color:#dbe5ff}
.fix{margin-top:44px;padding:26px 30px;border-radius:24px;background:#eaf0ff;color:var(--navy);font-size:32px;line-height:1.3;font-weight:600}
.fix span{display:block;font-family:'JetBrains Mono',monospace;font-size:18px;letter-spacing:.1em;color:var(--accent);margin-bottom:8px;font-weight:400}
.list{margin-top:40px;display:flex;flex-direction:column;gap:20px}
.li{display:grid;grid-template-columns:64px 1fr;gap:20px;align-items:center;font-size:36px;line-height:1.3;font-weight:500;padding:26px 28px;border-radius:24px;background:#fff;border:1px solid var(--line)}
.dark .li,.blue .li{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16)}
.li b{width:64px;height:64px;border-radius:18px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:30px}
.blue .li b{background:#fff;color:var(--accent)}
.shot{margin-top:40px;border-radius:24px;overflow:hidden;height:520px;border:1px solid rgba(255,255,255,.2);box-shadow:0 30px 70px rgba(8,15,30,.35);background:#fff}
.shot img{width:100%;height:100%;object-fit:cover;object-position:left top;display:block}
.chips{margin-top:30px;display:flex;flex-direction:column;gap:14px}
.chip{font-size:34px;font-weight:600}
.chip::before{content:'✓  ';color:var(--accent)}
.dark .chip::before{color:var(--accent-soft)}.blue .chip::before{color:#fff}
.cta{margin-top:48px;display:inline-block;align-self:flex-start;padding:28px 44px;border-radius:999px;background:var(--accent);color:#fff;font-size:38px;font-weight:700;box-shadow:0 18px 40px rgba(47,109,255,.4)}
.blue .cta{background:#fff;color:var(--accent)}
.vs{margin-top:36px;display:flex;flex-direction:column;gap:22px}
.side{padding:34px 34px;border-radius:28px;font-size:50px;line-height:1.15;font-weight:700;letter-spacing:-.02em}
.side small{display:block;font-family:'JetBrains Mono',monospace;font-size:20px;letter-spacing:.1em;text-transform:uppercase;font-weight:400;margin-bottom:14px;opacity:.75}
.side.l{background:#fff;border:1px solid var(--line);color:var(--ink)}
.dark .side.l,.blue .side.l{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);color:#fff}
.side.r{background:var(--accent);color:#fff}
.blue .side.r{background:#fff;color:var(--accent)}
.arrow{font-size:56px;line-height:1;text-align:center;opacity:.6}
.photo{background:#0b1426;color:#fff}
.photo .muted{color:#c9d4ea}
.photo .brand .lw{background-image:url(../assets/brand/wordmark-white.png)}
.photo .brand .lm{box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.photo .k{color:var(--accent-soft)}.photo .t i,.photo .pt i{font-family:'Instrument Serif',Georgia,serif;font-weight:400;color:var(--accent-soft)}
.photo .s,.photo .pb{color:#c9d4ea}
.post>.bgimg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(36px) brightness(.22) saturate(1.2);transform:scale(1.1);z-index:0}
.browser{margin-top:40px;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 40px 90px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25)}
.browser .bar{height:40px;display:flex;align-items:center;gap:8px;padding:0 16px;background:#eef2f9}
.browser .bar i{width:11px;height:11px;border-radius:50%;background:#c9d3e4;display:block}
.browser .bar span{margin-left:10px;font-family:'JetBrains Mono',monospace;font-size:15px;color:#637391}
.browser img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top}
.ask{margin-top:34px;display:inline-block;align-self:flex-start;padding:22px 32px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);font-size:34px;font-weight:600}
.tag{margin-top:18px;font-family:'JetBrains Mono',monospace;font-size:18px;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.collage{margin-top:36px;position:relative;height:700px;flex:none}
.collage .browser{position:absolute;width:560px;margin:0}
.collage .c0{left:0;top:0;transform:rotate(-5deg)}
.collage .c1{right:0;top:140px;transform:rotate(4deg);z-index:2}
.collage .c2{left:40px;top:290px;transform:rotate(-2deg);z-index:3}
.splitw{margin-top:30px;display:flex;flex-direction:column;gap:18px}
.splitw .lab{margin-top:10px;font-size:28px;font-weight:700}
.photo .li{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff}
.retro{width:100%;aspect-ratio:16/10;background:#000080 url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2240%22 height=%2240%22%3E%3Ctext y=%2228%22 font-size=%2220%22 fill=%22%23ffffff22%22%3E%E2%98%85%3C/text%3E%3C/svg%3E');font-family:'Comic Sans MS','Comic Neue',cursive;color:#ffff00;padding:14px;display:flex;flex-direction:column;gap:10px}
.rt-head{text-align:center;font-size:26px;font-weight:700;color:#ff00ff;text-shadow:2px 2px #00ffff}
.rt-marq{background:#ffff00;color:#ff0000;font-size:18px;font-weight:700;padding:4px 8px;white-space:nowrap;overflow:hidden}
.rt-body{flex:1;display:grid;grid-template-columns:150px 1fr;gap:12px}
.rt-side{background:#c0c0c0;color:#0000ee;padding:10px;font-size:18px;line-height:1.7;border:3px outset #fff}
.rt-main{background:#fff;color:#000;padding:14px;font-size:19px;border:3px inset #888}
.rt-blink{color:#ff0000;font-weight:700;font-size:22px}
.rt-count{font-family:'Courier New',monospace;background:#000;color:#00ff00;padding:2px 6px;font-size:16px}
.guess{margin-top:40px;height:600px;border-radius:28px;overflow:hidden;border:2px solid rgba(255,255,255,.25);box-shadow:0 40px 90px rgba(0,0,0,.55);position:relative;flex:none}
.guess img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.guess .q{position:absolute;right:20px;top:20px;width:84px;height:84px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:52px;font-weight:700}
.opts{margin-top:30px;display:flex;flex-direction:column;gap:14px}
.opt{padding:22px 28px;border-radius:20px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);font-size:34px;font-weight:600}
.phone{margin-top:36px;border-radius:40px;background:#e9eef6;padding:26px 24px 30px;box-shadow:0 40px 90px rgba(0,0,0,.45);flex:none}
.phone .who{display:flex;align-items:center;gap:16px;padding-bottom:18px;border-bottom:1px solid #d6dfed;color:#0c1730;font-size:28px;font-weight:700}
.phone .who b{width:60px;height:60px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:26px}
.phone .who small{display:block;font-size:20px;font-weight:400;color:#637391}
.bub{margin-top:18px;max-width:86%;padding:20px 24px;border-radius:24px 24px 24px 6px;background:#fff;color:#0c1730;font-size:30px;line-height:1.35;box-shadow:0 4px 10px rgba(17,37,73,.08)}
.bub time{display:block;text-align:right;font-size:18px;color:#8a97ad;margin-top:6px}
.annot{position:relative;line-height:0}
.annot img{width:100%;display:block}
.box{position:absolute;border:5px solid #ffd54a;border-radius:14px;box-shadow:0 0 0 9999px rgba(8,15,30,.0),0 0 30px rgba(255,213,74,.55)}
.box b{position:absolute;left:-22px;top:-22px;width:52px;height:52px;border-radius:50%;background:#ffd54a;color:#0c1730;display:grid;place-items:center;font-size:28px;font-weight:800;line-height:1}
.notes{margin-top:34px;display:flex;flex-direction:column;gap:16px}
.note{display:grid;grid-template-columns:52px 1fr;gap:18px;align-items:start;font-size:32px;line-height:1.3;font-weight:500}
.note b{width:52px;height:52px;border-radius:50%;background:#ffd54a;color:#0c1730;display:grid;place-items:center;font-size:28px;font-weight:800}
.swipe{font-family:'JetBrains Mono',monospace;font-size:24px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
</style></head><body>
<div class="post">
  
  <div class="glow" style="width:700px;height:700px;background:#a3c0ff;;right:-280px;top:-260px;opacity:0.55"></div>
  <div class="top"><div class="brand" aria-label="Vanaila"><span class="lm"></span><span class="lw"></span></div><div class="count muted">1/5</div></div>
  <div class="body"><div class="k">Sering terjadi</div><h1 class="t">Domain bisnisnya <i>expired</i>… lalu dibeli orang lain 😱</h1><p class="s">3 cara supaya ini nggak kejadian ke kamu</p></div>
  <div class="swipe">Geser →</div>
</div></body></html>
