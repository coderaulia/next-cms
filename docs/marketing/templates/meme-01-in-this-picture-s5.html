<!doctype html><html><head><meta charset="utf-8"><meta name="size" content="1080x1920"><link rel="stylesheet" href="_brand.css"><style>
html,body{width:1080px;height:1920px;background:#000}

.meme{position:absolute;left:0;right:0;top:560px;text-align:center;font-family:'Inter Tight',sans-serif;font-weight:600;font-size:64px;color:#fff;letter-spacing:-.01em;
 text-shadow:-3px -3px 0 #000,3px -3px 0 #000,-3px 3px 0 #000,3px 3px 0 #000,0 3px 0 #000,0 -3px 0 #000,3px 0 0 #000,-3px 0 0 #000}

<div class="frame"><div class="haze"></div><div class="spot"></div>
 <div class="logo" aria-label="Vanaila"><span class="lm"></span><span class="lw"></span></div>
