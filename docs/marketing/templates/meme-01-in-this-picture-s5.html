<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="size" content="1080x1920"><link rel="stylesheet" href="_brand.css"><style>
html,body{width:1080px;height:1920px}
.post{width:1080px;height:1920px;padding:170px 150px 440px 72px;background:linear-gradient(170deg,#0e1a30 0%,#0b1426 55%,#132a57 100%);color:#fff}
.post>.bgimg{position:absolute;inset:-40px;background:url('../../../public/templates-static/previews/aura-property.jpg') center/cover;filter:blur(40px) brightness(.28) saturate(1.1);transform:scale(1.1);z-index:0}
.brand .lw{background-image:url(../assets/brand/wordmark-white.png)}
.brand .lm{box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.body{flex:1;display:flex;flex-direction:column;justify-content:center}
.k{font-family:'JetBrains Mono',monospace;font-size:24px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-soft)}
.t{font-size:92px;line-height:1;letter-spacing:-.035em;font-weight:700;margin-top:22px}
.t i{font-family:'Instrument Serif',Georgia,serif;font-weight:400;letter-spacing:-.01em;color:var(--accent-soft)}
.stack{position:relative;height:560px;margin-top:44px;flex:none}
.browser{position:absolute;border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 40px 90px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25)}
.browser .bar{height:38px;display:flex;align-items:center;gap:8px;padding:0 16px;background:#eef2f9}
.browser .bar i{width:11px;height:11px;border-radius:50%;background:#c9d3e4;display:block}
.browser .bar span{margin-left:10px;font-family:'JetBrains Mono',monospace;font-size:15px;color:#637391}
.browser img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top}
.b1{left:0;top:0;width:760px}
.b2{right:0;top:250px;width:420px;transform:rotate(3deg)}
.chips{margin-top:40px;display:flex;flex-wrap:wrap;gap:12px}
.chip{padding:14px 22px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);font-size:26px;font-weight:500}
.chip::before{content:'✓  ';color:var(--accent-soft);font-weight:700}
.cta{margin-top:36px;align-self:flex-start;padding:26px 40px;border-radius:999px;background:var(--accent);color:#fff;font-size:34px;font-weight:700;box-shadow:0 18px 40px rgba(47,109,255,.45)}
.count{font-family:'JetBrains Mono',monospace;font-size:20px;letter-spacing:.08em;color:#c9d4ea}
</style></head><body>
<div class="post">
  <div class="bgimg"></div>
  <div class="glow" style="width:700px;height:700px;background:#2f6dff;right:-280px;top:-260px;opacity:.3"></div>
  <div class="top"><div class="brand" aria-label="Vanaila"><span class="lm"></span><span class="lw"></span></div><div class="count">5/5</div></div>
  <div class="body">
    <div class="k">…and she's looking at</div>
    <h1 class="t">Vanaila. Website yang bikin semua <i>menoleh</i>.</h1>
    <div class="stack">
      <div class="browser b1"><div class="bar"><i></i><i></i><i></i><span>Template Vanaila</span></div><img src="../../../public/templates-static/previews/aura-property.jpg"></div>
      <div class="browser b2"><div class="bar"><i></i><i></i><i></i></div><img src="../../../public/templates-static/previews/javanesa.jpg"></div>
    </div>
    <div class="chips"><span class="chip">Website bisnis</span><span class="chip">Aplikasi</span><span class="chip">Sistem bisnis</span></div>
    <div class="cta">Konsultasi → link di profil</div>
  </div>
</div></body></html>
